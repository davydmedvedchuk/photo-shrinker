name: Build Windows exe

# Run it by hand (Actions tab -> Build Windows exe -> Run workflow),
# or push a tag like v1.0 to also publish the exe as a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r cli/requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --onefile --name shrink --collect-all pillow_heif cli/shrink.py
      - name: Smoke test
        run: dist\shrink.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: shrink-windows
          path: dist/shrink.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/shrink.exe
